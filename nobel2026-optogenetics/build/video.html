<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用光点亮大脑</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080;
const cv = document.getElementById("c");
const X = cv.getContext("2d");
const TL = window.TIMELINE;

// ---------- palette ----------
const COL = {
  bg: "#03050c", blue: "#3ea6ff", cyan: "#6fe7ff", gold: "#e9c47e", goldHi: "#ffe3a6",
  amber: "#ffb53d", green: "#73e09a", algae: "#4fbf6a", red: "#ff5b5b", white: "#f4f7ff",
  dim: "rgba(220,230,255,0.62)", violet: "#a87bff", ion: "#ff9a3d", lipid: "#8fa3c8",
};
const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", sans-serif', LAT = 'Inter, "Noto Sans SC", sans-serif';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const fio = (t, a, b, fi = .6, fo = .6) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const TAU = Math.PI * 2;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
const frac = v => v - Math.floor(v);
const hash = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);

// ---------- timeline helpers ----------
const SC = {}; TL.scenes.forEach(s => SC[s.id] = s);
const CUES = {}; TL.cues.forEach(c => (CUES[c.scene] = CUES[c.scene] || []).push(c));
const cue = (id, i) => CUES[id][i].start - SC[id].start;
const cueEnd = (id, i) => CUES[id][i].end - SC[id].start;

// ---------- images ----------
const IMG = {};
const IMG_LIST = ["hegemann.jpg", "nagel.png", "deisseroth.jpg", "chlamy_lm.jpg", "chlamy_tem.jpg", "brainbow.jpg", "gfp_neurons.png", "opto_rig.jpg", "pyramidal.jpg"];
function loadImages() {
  return Promise.all(IMG_LIST.map(f => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => { IMG[f.split(".")[0]] = im; res(); }; im.onerror = rej; im.src = "../assets/img/" + f;
  })));
}

// ---------- drawing helpers ----------
function txt(s, x, y, o = {}) {
  X.save();
  X.globalAlpha *= (o.a ?? 1);
  X.font = `${o.w || 500} ${o.size || 40}px ${o.f || SANS}`;
  X.textAlign = o.align || "center"; X.textBaseline = o.base || "middle";
  if (o.ls) X.letterSpacing = o.ls + "px";
  if (o.glow) { X.shadowColor = o.glow; X.shadowBlur = o.blur || 30; }
  if (o.stroke) { X.lineWidth = o.stroke; X.strokeStyle = o.strokeColor || "rgba(0,0,0,.6)"; X.strokeText(s, x, y); }
  X.fillStyle = o.c || COL.white; X.fillText(s, x, y);
  if (o.glow && o.double) X.fillText(s, x, y);
  X.restore();
}
function glowDot(x, y, r, color, a = 1) {
  if (a <= 0.003 || r <= 0) return;
  X.save(); X.globalAlpha *= a; X.globalCompositeOperation = "lighter";
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(.25, color.replace(/[\d.]+\)$/, m => (parseFloat(m) * .45) + ")")); g.addColorStop(1, "rgba(0,0,0,0)");
  X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill(); X.restore();
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function imgCover(im, x, y, w, h, o = {}) {
  const z = o.zoom || 1, ar = im.width / im.height, br = w / h;
  let sw, sh; if (ar > br) { sh = im.height / z; sw = sh * br; } else { sw = im.width / z; sh = sw / br; }
  const sx = (im.width - sw) * (o.px ?? .5), sy = (im.height - sh) * (o.py ?? .5);
  X.save(); X.globalAlpha *= (o.a ?? 1); if (o.filter) X.filter = o.filter;
  X.drawImage(im, sx, sy, sw, sh, x, y, w, h); X.restore();
}
function roundRect(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function vignette(strength = .75) {
  const g = X.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${strength})`);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function bg(c1 = "#060a18", c2 = COL.bg) {
  const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
// dust particles drifting (deterministic)
function dust(t, n = 90, color = "rgba(140,190,255,0.5)", seed = 7) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sp = 6 + r() * 18, ph = r() * TAU, sz = .6 + r() * 2.2;
    const x = (x0 + t * sp * .6 + W) % W, y = (y0 - t * sp + H * 10) % H;
    const tw = .35 + .65 * Math.abs(Math.sin(t * .8 + ph));
    X.fillStyle = color.replace(/[\d.]+\)$/, (tw * parseFloat(color.match(/[\d.]+\)$/)[0])) + ")");
    X.beginPath(); X.arc(x, y, sz, 0, TAU); X.fill();
  }
}
function chapter(t, num, title, dur) {
  const a = fio(t, .3, dur - .2, .8, .6);
  X.save(); X.globalAlpha = a * .85;
  txt(num, 96, 82, { f: LAT, w: 600, size: 22, c: COL.cyan, align: "left", ls: 4 });
  X.fillStyle = rgba(COL.cyan, .7); X.fillRect(140, 81, 40 * eo(seg(t, .3, 1.3)), 2);
  txt(title, 196, 82, { w: 500, size: 24, c: "rgba(230,240,255,.9)", align: "left", ls: 3 });
  X.restore();
}
function credit(s, a = 1, x = W - 60, y = H - 34) {
  txt(s, x, y, { f: LAT, w: 400, size: 15, c: "rgba(200,210,235,.55)", align: "right", a });
}
function label(s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return;
  X.save(); X.globalAlpha *= a;
  X.font = `${o.w || 500} ${o.size || 30}px ${o.f || SANS}`;
  const tw = X.measureText(s).width, pad = o.pad || 18, h = (o.size || 30) * 1.7;
  const bx = (o.align === "left" ? x : o.align === "right" ? x - tw - pad * 2 : x - tw / 2 - pad);
  roundRect(bx, y - h / 2, tw + pad * 2, h, h / 2);
  X.fillStyle = o.bg || "rgba(8,16,36,.72)"; X.fill();
  X.strokeStyle = o.border || rgba(COL.cyan, .45); X.lineWidth = 1.5; X.stroke();
  X.restore();
  txt(s, bx + pad + tw / 2, y + 1, { ...o, align: "center", a });
}
// photon wiggle
function photon(x1, y1, x2, y2, k, color = COL.blue, amp = 10, waves = 7) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const head = k * L, tail = Math.max(0, head - 220);
  X.save(); X.globalCompositeOperation = "lighter"; X.lineCap = "round";
  for (const [lw, al] of [[10, .18], [5, .4], [2.4, 1]]) {
    X.strokeStyle = rgba(color, al); X.lineWidth = lw; X.beginPath();
    for (let s = tail; s <= head; s += 4) {
      const w = Math.sin(s / L * waves * TAU) * amp;
      const px = x1 + ux * s - uy * w, py = y1 + uy * s + ux * w;
      s === tail ? X.moveTo(px, py) : X.lineTo(px, py);
    }
    X.stroke();
  }
  X.restore();
  glowDot(x1 + ux * head, y1 + uy * head, 40, rgba(color, .9), k > 0 && k < 1 ? 1 : 0);
}

// ---------- procedural neuron (cached path) ----------
function makeNeuron(seed, scale = 1) {
  const r = rng(seed), branches = [];
  function grow(x, y, ang, len, w, depth) {
    const pts = [[x, y]]; let cx = x, cy = y, a = ang;
    const steps = Math.max(3, Math.floor(len / 14));
    for (let i = 0; i < steps; i++) { a += (r() - .5) * .5; cx += Math.cos(a) * len / steps; cy += Math.sin(a) * len / steps; pts.push([cx, cy]); }
    branches.push({ pts, w, depth });
    if (depth < 3) { const n = 1 + (r() < .7 ? 1 : 0); for (let k = 0; k < n; k++) grow(cx, cy, a + (r() - .5) * 1.4, len * (.55 + r() * .25), w * .62, depth + 1); }
  }
  const nd = 6;
  for (let i = 0; i < nd; i++) grow(0, 0, -Math.PI / 2 + (i - (nd - 1) / 2) * .55 + (r() - .5) * .3, (150 + r() * 80) * scale, 9 * scale, 0);
  // axon
  const ax = []; let ax0 = 0, ay0 = 30 * scale, aa = Math.PI / 2 + .2;
  for (let i = 0; i < 60; i++) { aa += Math.sin(i * .35) * .05; ax0 += Math.cos(aa) * 9 * scale; ay0 += Math.sin(aa) * 9 * scale; ax.push([ax0, ay0]); }
  return { branches, axon: ax };
}
function drawNeuron(N, x, y, o = {}) {
  const col = o.color || COL.cyan, glow = o.glow ?? .5, a = o.a ?? 1;
  X.save(); X.translate(x, y); X.rotate(o.rot || 0); X.globalAlpha *= a; X.lineCap = "round"; X.lineJoin = "round";
  if (glow > 0) { X.shadowColor = col; X.shadowBlur = 18 + 30 * glow; }
  X.strokeStyle = col;
  for (const b of N.branches) {
    X.lineWidth = Math.max(1, b.w); X.beginPath(); b.pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.stroke();
  }
  X.lineWidth = 4; X.beginPath(); X.moveTo(0, 20); N.axon.forEach(p => X.lineTo(p[0], p[1])); X.stroke();
  X.fillStyle = col; X.beginPath(); X.ellipse(0, 0, 34, 30, 0, 0, TAU); X.fill();
  X.restore();
}

// ---------- shared network (scene 1, 10) ----------
const NET = (() => {
  const r = rng(42), nodes = [], edges = [];
  for (let i = 0; i < 170; i++) nodes.push({ x: (r() - .5) * 2600, y: (r() - .5) * 1500, z: r(), ph: r() * TAU, cl: 0 });
  nodes.forEach((n, i) => {
    const d = nodes.map((m, j) => [Math.hypot(m.x - n.x, m.y - n.y), j]).sort((a, b) => a[0] - b[0]);
    for (let k = 1; k <= 3; k++) if (d[k][0] < 330) edges.push([i, d[k][1]]);
  });
  // cluster: nodes near (380,-120)
  nodes.forEach(n => n.cl = Math.hypot(n.x - 380, n.y + 120) < 230 ? 1 : 0);
  return { nodes, edges };
})();
function drawNet(t, o = {}) {
  const cam = o.cam || { x: 0, y: 0, z: 1 }, base = o.base ?? .35, beamX = o.beamX ?? -1e9;
  const P = n => { const par = .6 + n.z * .6; return [W / 2 + (n.x - cam.x * par) * cam.z, H / 2 + (n.y - cam.y * par) * cam.z]; };
  const lit = n => { const [px] = P(n); const b = clamp(1 - Math.abs(px - beamX) / 260); return b; };
  X.save(); X.globalCompositeOperation = "lighter";
  for (const [i, j] of NET.edges) {
    const a = NET.nodes[i], b = NET.nodes[j], [x1, y1] = P(a), [x2, y2] = P(b);
    const al = (base * .35 + .4 * Math.max(lit(a), lit(b))) * (o.a ?? 1);
    X.strokeStyle = `rgba(90,170,255,${al})`; X.lineWidth = 1.1 * cam.z; X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke();
    // traveling spike
    if (o.spikes) {
      const e = (i * 31 + j * 17) % 97, per = 2.6 + (e % 7) * .45, k = frac(t / per + e * .113);
      if (hash(e + Math.floor(t / per + e * .113)) < o.spikes) {
        const sx = lerp(x1, x2, k), sy = lerp(y1, y2, k);
        glowDot(sx, sy, 14 * cam.z, "rgba(140,220,255,0.9)", (o.a ?? 1) * Math.sin(k * Math.PI));
      }
    }
  }
  for (const n of NET.nodes) {
    const [x, y] = P(n), tw = .55 + .45 * Math.sin(t * 1.3 + n.ph);
    let b = base * tw + lit(n) * 1.2, col = "rgba(120,200,255,1)";
    if (o.cluster && n.cl) { b = Math.max(b, o.cluster * (.8 + .2 * Math.sin(t * 6 + n.ph))); col = "rgba(90,160,255,1)"; }
    if (o.dimOthers && !n.cl) b *= 1 - o.dimOthers * .75;
    const r = (3 + n.z * 3) * cam.z;
    glowDot(x, y, r * 7, col.replace(",1)", `,${.55 * clamp(b)})`), o.a ?? 1);
    X.fillStyle = `rgba(220,240,255,${clamp(b) * (o.a ?? 1)})`; X.beginPath(); X.arc(x, y, r * .7, 0, TAU); X.fill();
  }
  X.restore();
}

// ================= SCENES =================
const SCENES = {};

// S01 — opening
SCENES.s01 = (t, d) => {
  bg("#02040b", "#000");
  const camx = t * 14, camz = 1.02 + t * .006;
  // gfp photo interlude
  const pa = fio(t, 7.0, 13.6, 1.4, 1.4);
  if (pa > 0) {
    imgCover(IMG.gfp_neurons, 0, 0, W, H, { zoom: 1.08 + (t - 7) * .018, px: .4 + (t - 7) * .01, py: .5, a: pa * .85, filter: "saturate(1.2) brightness(1.05)" });
    X.fillStyle = `rgba(0,0,0,${pa * .25})`; X.fillRect(0, 0, W, H);
  }
  const beamX = lerp(-300, W + 300, eio(seg(t, .4, 3.6)));
  const netA = 1 - pa * .85;
  const clusterK = eo(seg(t, 15.0, 16.5));
  drawNet(t, { cam: { x: camx, y: 0, z: camz }, base: .18 + .25 * seg(t, 1.5, 4), beamX, spikes: .35 * seg(t, 3, 5), a: netA, cluster: clusterK, dimOthers: clusterK });
  // beam
  if (t < 4.2) {
    const g = X.createLinearGradient(beamX - 260, 0, beamX + 260, 0);
    g.addColorStop(0, "rgba(60,150,255,0)"); g.addColorStop(.5, "rgba(80,170,255,0.33)"); g.addColorStop(1, "rgba(60,150,255,0)");
    X.save(); X.globalCompositeOperation = "lighter"; X.fillStyle = g; X.fillRect(beamX - 260, 0, 520, H); X.restore();
  }
  // title
  const ta = fio(t, 2.4, 7.4, 1.2, .9);
  if (ta > 0) {
    const s = 1 + .03 * seg(t, 2.4, 7.4);
    X.save(); X.translate(W / 2, H / 2 - 30); X.scale(s, s);
    txt("用光，点亮大脑", 0, 0, { f: SERIF, w: 900, size: 132, c: COL.white, glow: "rgba(80,170,255,.95)", blur: 50, a: ta, ls: 14, double: true });
    X.restore();
    X.fillStyle = rgba(COL.gold, ta * .8); X.fillRect(W / 2 - 160 * eo(seg(t, 3, 4.4)), H / 2 + 62, 320 * eo(seg(t, 3, 4.4)), 2);
    txt("2026 诺贝尔生理学或医学奖 · 光遗传学", W / 2, H / 2 + 112, { w: 500, size: 38, c: COL.goldHi, a: ta * seg(t, 3.2, 4.4), ls: 6 });
  }
  if (pa > 0) label("真实的神经元网络 · 荧光显微图像", W / 2, 150, { size: 26, a: pa * seg(t, 8, 9) });
  if (pa > 0) credit("Image: ManuelSchottdorf / Wikimedia Commons, CC BY-SA 4.0", pa);
  // counter
  const ca = fio(t, 3.4, 7.2, .6, .6) * 0;
  // question ring
  if (clusterK > 0) {
    const cx = W / 2 + (380 - camx * (.6 + .5 * .6)) * camz, cy = H / 2 - 120 * camz;
    X.save(); X.strokeStyle = rgba(COL.cyan, clusterK * .9); X.lineWidth = 2.5; X.setLineDash([10, 10]); X.lineDashOffset = -t * 30;
    X.beginPath(); X.arc(cx, cy, 250 + 8 * Math.sin(t * 3), 0, TAU); X.stroke(); X.restore();
    txt("?", cx + 230, cy - 210, { f: SERIF, w: 900, size: 120, c: COL.cyan, glow: COL.blue, a: clusterK });
  }
  txt("860亿", W - 300, H - 230, { f: SERIF, w: 900, size: 110, c: COL.white, glow: "rgba(80,170,255,.7)", a: fio(t, 3.6, 7.0, .6, .6) * 0 });
  vignette(.8);
};

// S02 — laureates
const LAUREATES = [
  { img: "hegemann", zh: "彼得·黑格曼", en: "Peter Hegemann", inst: "柏林洪堡大学", c: "德国", credit: "Millencolin, CC BY-SA 4.0" },
  { img: "nagel", zh: "格奥尔格·纳格尔", en: "Georg Nagel", inst: "维尔茨堡大学", c: "德国", credit: "Millencolin, CC0" },
  { img: "deisseroth", zh: "卡尔·戴瑟罗斯", en: "Karl Deisseroth", inst: "斯坦福大学 · HHMI", c: "美国", credit: "Cmichel67, CC BY-SA 4.0" },
];
function portraitCard(L, x, y, a, s = 1, o = {}) {
  if (a <= 0) return;
  const w = 380 * s, h = 470 * s;
  X.save(); X.globalAlpha *= a; X.translate(x, y);
  // glow frame
  X.shadowColor = rgba(COL.gold, .5); X.shadowBlur = 40;
  roundRect(-w / 2, -h / 2, w, h, 26 * s); X.fillStyle = "rgba(14,18,34,.92)"; X.fill(); X.shadowBlur = 0;
  X.strokeStyle = rgba(COL.gold, .75); X.lineWidth = 2; X.stroke();
  X.save(); roundRect(-w / 2 + 14 * s, -h / 2 + 14 * s, w - 28 * s, h * .62, 18 * s); X.clip();
  const im = IMG[L.img]; imgCover(im, -w / 2 + 14 * s, -h / 2 + 14 * s, w - 28 * s, h * .62, { zoom: 1, py: L.img === "deisseroth" ? .22 : .35 });
  X.restore();
  txt(L.zh, 0, h * .24, { f: SERIF, w: 900, size: 40 * s, c: COL.white });
  txt(L.en, 0, h * .32, { f: LAT, w: 600, size: 22 * s, c: COL.goldHi, ls: 1 });
  txt(`${L.inst} · ${L.c}`, 0, h * .41, { w: 400, size: 21 * s, c: COL.dim });
  X.restore();
}
SCENES.s02 = (t, d) => {
  bg("#0a0a14", "#020205");
  // golden halo rings
  const ra = fio(t, 0, d, 1, .6);
  X.save(); X.translate(W / 2, H / 2 - 20); X.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    X.strokeStyle = rgba(COL.gold, (.22 - i * .05) * ra); X.lineWidth = 2 - i * .4;
    X.beginPath(); X.arc(0, 0, 330 + i * 70 + 10 * Math.sin(t * .8 + i), t * .2 * (i % 2 ? -1 : 1), t * .2 * (i % 2 ? -1 : 1) + TAU * .82); X.stroke();
  }
  X.restore();
  dust(t, 120, "rgba(255,210,140,0.55)", 3);
  // phase 1: announcement
  const p1 = fio(t, .5, cue("s02", 1) + .2, .8, .6);
  if (p1 > 0) {
    txt("2026 · 10 · 05", W / 2, H / 2 - 150, { f: LAT, w: 600, size: 44, c: COL.goldHi, ls: 10, a: p1 });
    txt("诺贝尔生理学或医学奖", W / 2, H / 2 - 20, { f: SERIF, w: 900, size: 104, c: COL.white, glow: rgba(COL.gold, .8), blur: 40, a: p1 * seg(t, 1.0, 2.0), ls: 8 });
    txt("The Nobel Prize in Physiology or Medicine", W / 2, H / 2 + 90, { f: LAT, w: 400, size: 30, c: COL.dim, a: p1 * seg(t, 1.6, 2.6), ls: 3 });
  }
  // phase 2: cards
  const c1 = cue("s02", 1), c2 = cue("s02", 2), c3 = cue("s02", 3);
  const out = 1 - seg(t, c3 - .2, c3 + .5);
  const xs = [W / 2 - 470, W / 2, W / 2 + 470];
  [0, 1, 2].forEach(i => {
    const st = i < 2 ? c1 + .3 + i * 1.6 : c2 + .1, k = eback(seg(t, st, st + .8));
    portraitCard(LAUREATES[i], xs[i], H / 2 - 10 + (1 - k) * 80, seg(t, st, st + .5) * out, .95);
  });
  if (seg(t, c1, c1 + .5) * out > 0) credit("Photos: " + LAUREATES.map(l => l.credit).join(" · ") + " / Wikimedia Commons", seg(t, c1, c1 + .5) * out);
  // phase 3: optogenetics word
  const p3 = seg(t, c3, c3 + .9);
  if (p3 > 0) {
    const s = .9 + .1 * eo(p3);
    X.save(); X.translate(W / 2, H / 2 - 40); X.scale(s, s);

// ================= SUBTITLES & MASTER =================
function subtitles(gt) {
  const c = TL.cues.find(c => gt >= c.start - .05 && gt <= c.end + .15);
  if (!c) return;
  const a = Math.min(seg(gt, c.start - .05, c.start + .15), 1 - seg(gt, c.end, c.end + .15));
  X.save(); X.globalAlpha = a;
  X.font = `500 40px ${SANS}`;
  const tw = X.measureText(c.text).width;
  const y = H - 92;
  const g = X.createLinearGradient(0, y - 60, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)");
  X.fillStyle = g; X.fillRect(W / 2 - tw / 2 - 200, y - 60, tw + 400, H - y + 60);
  X.restore();
  txt(c.text, W / 2, y, { w: 500, size: 40, c: "#ffffff", a, stroke: 6, strokeColor: "rgba(0,0,0,.75)", ls: 1 });
}
function grain(gt) {
  const R = rng(Math.floor(gt * 30) + 1);
  X.save(); X.globalAlpha = .035;
  for (let i = 0; i < 260; i++) { X.fillStyle = R() < .5 ? "#fff" : "#000"; X.fillRect(R() * W, R() * H, 2, 2); }
  X.restore();
}
window.renderAt = function (gt) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = "source-over"; X.filter = "none"; X.shadowBlur = 0;
  X.fillStyle = "#000"; X.fillRect(0, 0, W, H);
  const s = TL.scenes.find(s => gt >= s.start && gt < s.end) || TL.scenes[TL.scenes.length - 1];
  const lt = gt - s.start, d = s.end - s.start;
  X.save(); SCENES[s.id](lt, d); X.restore();
  // dip to black at scene boundaries
  const fadeIn = s.id === "s01" ? seg(lt, 0, 1.2) : seg(lt, 0, .45);
  const fadeOut = s.id === "s10" ? 1 - seg(lt, d - 1.2, d) : 1 - seg(lt, d - .4, d);
  const k = Math.min(fadeIn, fadeOut);
  if (k < 1) { X.fillStyle = `rgba(0,0,0,${1 - k})`; X.fillRect(0, 0, W, H); }
  subtitles(gt);
  grain(gt);
};
window.ready = (async () => {

  for (const sp of specs) await document.fonts.load(sp, sample);
  await document.fonts.ready;
  window.renderAt(0);
  return true;
})();
// preview mode: ?t=12.3 renders a still; ?play plays in real time

});
